  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "NGO",
    "name": "Instituto Anjos do Leite de Apoio à Amamentação e à Primeira Infância",
    "alternateName": "Instituto Anjos do Leite",
    "slogan": "Porque todo começo merece cuidado.",
    "url": "https://institutoanjosdoleite.org.br",
    "logo": "https://institutoanjosdoleite.org.br/assets/logo.webp",
    "description": "Instituto que promove acolhimento, educação em saúde e apoio especializado à amamentação e à primeira infância.",
    "founder": { "@type": "Person", "name": "Sandra Abreu", "jobTitle": "Fundadora e Presidente" },
    "areaServed": { "@type": "Place", "name": "Baixada Santista, São Paulo, Brasil" },
    "sameAs": ["https://instagram.com/anjosdoleite"]
  }
  </script>

  <script>
    /* Liga as animações. Se o GSAP não estiver pronto em 2,5 s
       (sem internet, arquivo fora do ar), a classe sai e a página
       aparece normalmente: nada fica invisível. */
    (function () {
      var raiz = document.documentElement;
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      raiz.classList.add("anima-pronto");
      setTimeout(function () {
        if (!raiz.classList.contains("anima-ok")) raiz.classList.remove("anima-pronto");
      }, 2500);
    })();
  </script>
</head>
<body>

<a class="pular" href="#conteudo">Pular para o conteúdo</a>

<main id="conteudo">

   aria-label="Falar com o Instituto pelo WhatsApp">

</a>

<script src="/js/vendor/gsap.min.js" defer></script>

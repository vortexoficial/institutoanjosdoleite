name = "instituto-anjos-do-leite"
pages_build_output_dir = "dist"
compatibility_date = "2026-07-01"

# Armazenamento do painel (fotos trocadas e informações do Instituto).
#
# Antes do primeiro deploy, criar o espaço de dados e colar o id aqui:
#   npx wrangler kv namespace create CMS
#
# Enquanto o id não existir, deixe estas três linhas comentadas: o site
# continua funcionando com os espaços reservados do build, e o painel
# avisa que o armazenamento ainda não foi configurado.
#
# [[kv_namespaces]]
# binding = "CMS"
# id = "cole-o-id-aqui"
